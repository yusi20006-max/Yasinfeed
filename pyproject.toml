[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasinfeed"
version = "1.0.0"
description = "Core Foundation of YasinFeed - collects, processes, prepares, and publishes content outputs."
readme = "README.md"
authors = [
    { name = "YasinFeed Developers" }
]
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "feedparser",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
yasinai = [
    # Unreleased integration pin per docs/RELEASE_DEPENDENCY_POLICY.md (Yasin-AI) section 2.
    # This is NOT the released v1.1.4 tag; move to a release tag once promoted per section 4.
    "yasinai @ git+https://github.com/yusi20006-max/Yasin-AI.git@f778338be03e8085e8cc7f82e54e4bfdd39b68dd",
]

[project.scripts]
yasinfeed = "yasinfeed.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yasinfeed*"]
