[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasinfeed"
version = "0.2.0"
description = "Core Foundation of YasinFeed - collects, processes, prepares, and publishes content outputs."
readme = "README.md"
authors = [
    { name = "YasinFeed Developers" }
]
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "feedparser",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yasinfeed*"]
