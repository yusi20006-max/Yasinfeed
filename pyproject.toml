[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasinfeed"
version = "1.0.0"
description = "Core Foundation of YasinFeed - collects, processes, prepares, and publishes content outputs."
readme = "README.md"
authors = [
    { name = "YasinFeed Developers" }
]
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "feedparser",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
yasinai = [
    "yasinai @ git+https://github.com/yusi20006-max/Yasin-AI.git@v1.1.4",
]

[project.scripts]
yasinfeed = "yasinfeed.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yasinfeed*"]
