# YasinFeed Core Configuration

app:
  name: "YasinFeed"
  env: "production"

logging:
  level: "INFO"
  file_path: "yasinfeed.log"
  console: true

api:
  host: "127.0.0.1"
  port: 8000

fetch:
  interval_seconds: 300

rewrite:
  # Prefer canonical Yasin-AI public contracts when the package is installed:
  #   provider: "yasinai"
  # Default remains "dummy" for offline/CI without yasinai.
  provider: "dummy"
  yasinai:
    api_key: ""
    model: "gpt-4o-mini"
    temperature: 0.7
    max_tokens: 2048
    # optional: pin Yasin-AI provider name (openai, local, anthropic)
    provider: null
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "gpt-3.5-turbo"
    temperature: 0.7
    max_tokens: null
  huggingface:
    api_key: ""
    model: "meta-llama/Llama-3-8b-instruct"
    api_url: null
    temperature: null
    max_new_tokens: null
  # Optional ordered failover after primary:
  # failover:
  #   - provider: dummy
  #     config: {}

storage:
  type: "sqlite"
  path: "data/yasinfeed.db"

scheduler:
  enabled: true

publisher:
  eitaa:
    enabled: false
  pwa:
    enabled: false
    output_path: "data/pwa/feed.json"
    base_url: ""
  rss:
    enabled: false
    output_path: "data/rss/feed.xml"
    title: "YasinFeed"
    link: "http://127.0.0.1:8000/api/feed"
    description: "YasinFeed published news"

models:
  provider: "dummy"
