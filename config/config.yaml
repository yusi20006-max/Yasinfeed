# YasinFeed Core Configuration

app:
  name: "YasinFeed"
  env: "production"

logging:
  level: "INFO"
  file_path: "yasinfeed.log"
  console: true

api:
  host: "127.0.0.1"
  port: 8000

fetch:
  interval_seconds: 300

rewrite:
  provider: "dummy"
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "gpt-3.5-turbo"
    temperature: 0.7
    max_tokens: null
  huggingface:
    api_key: ""
    model: "meta-llama/Llama-3-8b-instruct"
    api_url: null
    temperature: null
    max_new_tokens: null

storage:
  type: "sqlite"
  path: "data/yasinfeed.db"

scheduler:
  enabled: true

publisher:
  eitaa:
    enabled: false
  pwa:
    enabled: false
  rss:
    enabled: false

models:
  provider: "dummy"
